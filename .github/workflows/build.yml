name: Build HyperBatteryStats APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Dosyaları al
        uses: actions/checkout@v4

      - name: ZIP arşivini aç ve proje klasörünü bul
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          unzip -o "$ZIP_FILE" -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name 'settings.gradle.kts' | head -n 1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: APK derle
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease --no-daemon

      - name: APK dosyasını hazırla
        run: |
          APK_FILE=$(find "${{ env.PROJECT_DIR }}/app/build/outputs/apk/release" -name "*.apk" | head -n 1)
          cp "$APK_FILE" HyperBatteryStats-HyperOS4.apk

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: HyperBatteryStats-HyperOS4-APK
          path: HyperBatteryStats-HyperOS4.apk
          retention-days: 30
